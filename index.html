/* =========================
   SPREADSHEET ID
========================= */

const spreadsheetID =
"1_5kYMUilnKPlLP7Y4y3Vo4zse2wgdNMYwSKEd4TdJRs";

/* =========================
   URL SHEET
========================= */

const siswaURL =
`https://opensheet.elk.sh/${spreadsheetID}/siswa`;

const settingURL =
`https://opensheet.elk.sh/${spreadsheetID}/setting`;

let siswaData = [];

/* =========================
   LOAD DATA
========================= */

async function loadData(){

try{

/* DATA SISWA */

const siswaRes =
await fetch(siswaURL);

siswaData =
await siswaRes.json();

/* DATA SETTING */

const settingRes =
await fetch(settingURL);

const settingData =
await settingRes.json();

const tanggal =
settingData[0]
.tanggal_pengumuman;

startCountdown(tanggal);

}catch(err){

console.log(err);

alert("Gagal mengambil data spreadsheet");

}

}

/* =========================
   COUNTDOWN
========================= */

function startCountdown(date){

const targetDate =
new Date(date).getTime();

function updateCountdown(){

const now =
new Date().getTime();

const distance =
targetDate - now;

if(distance <= 0){

document.getElementById(
"countdownSection")
.style.display="none";

document.getElementById(
"resultArea")
.classList.add("active");

return;

}

const days =
Math.floor(distance /
(1000*60*60*24));

const hours =
Math.floor((distance %
(1000*60*60*24)) /
(1000*60*60));

const minutes =
Math.floor((distance %
(1000*60*60)) /
(1000*60));

const seconds =
Math.floor((distance %
(1000*60)) / 1000);

document.getElementById("days")
.innerHTML = days;

document.getElementById("hours")
.innerHTML = hours;

document.getElementById("minutes")
.innerHTML = minutes;

document.getElementById("seconds")
.innerHTML = seconds;

}

setInterval(updateCountdown,1000);

updateCountdown();

}

/* =========================
   CEK KELULUSAN
========================= */

function cekKelulusan(){

const keyword =
document.getElementById("keyword")
.value
.toLowerCase()
.trim();

const resultBox =
document.getElementById("hasil");

/* CARI BERDASARKAN NISN ATAU NAMA */

const siswa =
siswaData.find(item =>

item.nisn.toLowerCase()
.includes(keyword)

||

item.nama.toLowerCase()
.includes(keyword)

);

resultBox.style.display="block";

/* JIKA DATA DITEMUKAN */

if(siswa){

/* DITERIMA */

if(siswa.status
.toUpperCase() ===
"DITERIMA"){

resultBox.className =
"result diterima";

resultBox.innerHTML = `

<h2>
SELAMAT ANDA DITERIMA
</h2>

<p>
<b>Nama :</b>
${siswa.nama}
</p>

<p>
<b>NISN :</b>
${siswa.nisn}
</p>

<p>
<b>Asal Sekolah :</b>
${siswa.asal_sekolah}
</p>

<p>
<b>Status :</b>
${siswa.status}
</p>


<button class="btn"
onclick="downloadSurat('${siswa.nama}','${siswa.nisn}','${siswa.asal_sekolah}')">
DOWNLOAD SURAT KETERANGAN DITERIMA
</button>

`;

}else{

/* TIDAK DITERIMA */

resultBox.className =
"result tidak";

resultBox.innerHTML = `

<h2>
MOHON MAAF
</h2>

<p>
Anda dinyatakan
TIDAK DITERIMA
di SMKN 1 Bunga Mayang
</p>

<br>

<p>
<b>Nama :</b>
${siswa.nama}
</p>

<p>
<b>NISN :</b>
${siswa.nisn}
</p>

<p>
<b>Asal Sekolah :</b>
${siswa.asal_sekolah}
</p>

`;

}

}else{

/* DATA TIDAK ADA */

resultBox.className =
"result tidak";

resultBox.innerHTML = `

<h2>
DATA TIDAK DITEMUKAN
</h2>

<p>
Periksa kembali
